<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VPO Digital v2.2 ECO-MOD - CMN S. XXI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Identity Services & API Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            imss: {
              green: '#137759',
              gold: '#B38E5D'
            },
            clinical: {
              navy: '#1e3a8a', // Azul Marino
              red: '#b91c1c',  // Rojo Alerta
              bg: '#f8fafc'
            }
          }
        },
      },
    }
  </script>
  <style>
    @media print {
      @page {
        size: letter;
        margin: 0.5cm;
      }

      body {
        -webkit-print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }
    }

    .print-only {
      display: none;
    }

    /* Custom scrollbar for clinical look */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Neural Pulse Effect */
    @keyframes neural-pulse {

      0%,
      100% {
        opacity: 1;
        filter: brightness(100%);
      }

      5% {
        opacity: 0.8;
        filter: brightness(130%);
      }

      10% {
        opacity: 1;
        filter: brightness(100%);
      }

      50% {
        opacity: 1;
        filter: brightness(100%);
      }

      55% {
        opacity: 0.9;
        filter: brightness(150%) drop-shadow(0 0 2px rgba(50, 200, 255, 0.5));
      }

      60% {
        opacity: 1;
        filter: brightness(100%);
      }
    }

    .neural-anim {
      animation: neural-pulse 3s infinite;
    }

    /* Background Eraser for White Sidebar */
    .erase-bg {
      mix-blend-mode: multiply;
      filter: contrast(150%) brightness(110%);
    }
  </style>
</head>

<body class="bg-clinical-bg text-slate-800">
  <div id="root"></div>
  <script>
    // FORCE CACHE CLEARING STRATEGY
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('Service Worker Warning: Unregistered to force update.');
        }
      });

      // Optional: Force reload if we detect it was controlled
      // if (navigator.serviceWorker.controller) {
      //   window.location.reload(); 
      // }
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
